# Intégration continue : à chaque push et pull request, le code est vérifié (ESLint),
# le HTML autonome est assemblé depuis les sources, puis les régressions sont lancées.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Electron n'est pas utile aux vérifications : son binaire n'est pas téléchargé.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Assemblage du HTML autonome
        run: npm run build

      - name: Régressions
        run: npm test
